apiVersion: v1
kind: ConfigMap
metadata:
  name: cms-labs-terminal-config
  namespace: $NAME
  labels:
    cms-labs.io/terminal-config: "true"
data:
  config.yaml: |-
    targets:
      - name: pc1
        label: PC1
        mode: exec
        command: [/bin/sh]
      - name: dns1
        label: DNS1
        mode: exec
        command: [/bin/sh]
